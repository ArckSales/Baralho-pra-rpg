<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Baralho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="palco">

    <header class="topo">
      <p class="rotulo">Baralho Ecaflip - Lucky Ace F.</p>
      <h1>Puxe uma carta</h1>
    </header>

    <section class="mesa">

      <div class="area-carta">
        <button class="carta" id="carta" aria-label="Puxar uma carta">
          <div class="carta-interior">
            <div class="face verso">
              <img class="verso-img" src="Imagens/verso.png" alt="">
            </div>
            <div class="face frente">
              <div class="frente-arte-wrap">
  <div class="frente-arte" id="frenteArte"></div>
  <svg class="frente-moldura" viewBox="0 0 200 280" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <path id="estrela-moldura" d="M0,-6 L1.8,-1.8 L6,0 L1.8,1.8 L0,6 L-1.8,1.8 L-6,0 L-1.8,-1.8 Z" fill="#b8935a"/>
    </defs>
    <rect x="6" y="6" width="188" height="268" rx="10" fill="none" stroke="#b8935a" stroke-width="3"/>
    <rect x="14" y="14" width="172" height="252" rx="7" fill="none" stroke="#b8935a" stroke-width="1" opacity="0.5"/>
    <use href="#estrela-moldura" x="18" y="18"/>
    <use href="#estrela-moldura" x="182" y="18"/>
    <use href="#estrela-moldura" x="18" y="262"/>
    <use href="#estrela-moldura" x="182" y="262"/>
  </svg>
</div>
              <p class="frente-nome" id="frenteNome"></p>
            </div>
          </div>
        </button>
        <p class="instrucao" id="instrucao">clique na carta</p>
      </div>

      <div class="area-texto">
        <div class="revelacao" id="revelacao">
          <p class="revelacao-vazia" id="revelacaoVazia">A descrição da carta sorteada aparece aqui.</p>
          <div class="revelacao-conteudo" id="revelacaoConteudo" hidden>
            <h2 id="nomeCarta"></h2>
            <p id="textoCarta"></p>
            <p class="efeito-especial" id="efeitoEspecial" hidden></p>
          </div>
        </div>

        <div class="sacrificio" id="painelSacrificio" hidden>
          <p class="sacrificio-titulo">Cartas sacrificadas</p>
          <ul class="sacrificio-lista" id="listaSacrificadas"></ul>
        </div>
      </div>

    </section>

    <footer class="rodape">
      <p class="contador" id="contador">6 cartas no baralho</p>
      <div class="rodape-botoes">
        <button class="sacrificar" id="botaoSacrificar">Sacrifício</button>
        <button class="embaralhar" id="botaoEmbaralhar" hidden>Embaralhar novamente</button>
      </div>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
